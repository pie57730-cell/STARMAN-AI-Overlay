name: Build STARMAN MLBB AI Coach APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Setup Gradle & Build Debug APK
        uses: gradle/actions/setup-gradle@v3
        with:
          arguments: assembleDebug

      - name: 5. Namakan Fail APK Kepada STARMAN-MLBB-AI-COACH.apk
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk STARMAN-MLBB-AI-COACH.apk

      - name: 6. Upload STARMAN-MLBB-AI-COACH.apk Sebagai Artifact
        uses: actions/upload-artifact@v4
        with:
          name: STARMAN-MLBB-AI-COACH
          path: STARMAN-MLBB-AI-COACH.apk
